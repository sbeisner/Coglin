<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coglin — run a whole FIRST Tech Challenge season in one place</title>
    <meta
      name="description"
      content="One place for a whole FIRST Tech Challenge season: build, programming and CAD boards, meeting notes and attendance, outreach, sponsors, award evidence and portfolio planning."
    />
    <link rel="canonical" href="https://coglin.lilithforge.com/" />

    <!-- FALLBACK ONLY. scripts/prerender.mjs strips these and writes per-route
         title, description, canonical and OG tags into each marketing page at
         build time. What is left here is what an unprerendered route gets —
         /app/*, /login, /invite/:token — none of which should be indexed. Edit
         src/marketing/seo.ts, not this. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Coglin" />
    <meta property="og:url" content="https://coglin.lilithforge.com/" />
    <meta
      property="og:title"
      content="Coglin — run a whole FTC season in one place"
    />
    <meta
      property="og:description"
      content="Season operations for FIRST Tech Challenge teams: boards, meeting notes, award evidence and portfolio planning in one place."
    />
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Coglin — run a whole FTC season in one place"
    />
    <meta
      name="twitter:description"
      content="Season operations for FIRST Tech Challenge teams."
    />
    <!-- Applies the stored theme BEFORE first paint, so there is no flash of
         the wrong theme. Must stay inline and must stay ahead of the bundle.
         Mirrors THEME_BOOT_SCRIPT in src/lib/theme.ts — edit both together. -->
    <script>
      try {
        var t = localStorage.getItem('coglin.theme');
        var dark =
          t === 'dark' ||
          (t !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.dataset.theme = 'dark';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
